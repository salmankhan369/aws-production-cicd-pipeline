name: Production Image CI Workflow

on:
  push:
    branches: [ main ]

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub Account
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Microservice Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/production-k8s-app:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/production-k8s-app:latest
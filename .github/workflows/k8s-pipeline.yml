name: Production Multi-Cloud CI/CD Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  infrastructure-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # ==========================================
    # TERRAFORM STAGE (Infrastructure as Code)
    # ==========================================
    - name: Setup HashiCorp Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"
        terraform_wrapper: false

    - name: Terraform Init & Apply
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: "us-east-1" # Replace with your target AWS Region (e.g. ap-south-1)
      run: |
        cd terraform
        terraform init
        terraform apply -auto-approve

    # ==========================================
    # DOCKER STAGE (Continuous Integration)
    # ==========================================
    - name: Login to Docker Hub Account
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Microservice Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/production-k8s-app:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/production-k8s-app:latest